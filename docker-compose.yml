name: kyc-setu

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: kyc_setu
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kyc -d kyc_setu']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes images to Docker Hub/Quay; Chainguard's build is the free public one.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # OCR + extraction service. Opt-in (large image): `make ai` or `docker compose --profile ai up -d --build ai`.
  ai:
    profiles: ['ai']
    build: ./services/ai
    ports:
      - '8000:8000'
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?set AI_INTERNAL_KEY in .env}
      # The worker sends the API's public URL (http://localhost:4000). Inside this container that
      # means the container itself, so fetches are redirected to the host.
      AI_FETCH_ALLOWED_ORIGINS: http://localhost:4000
      AI_FETCH_ORIGIN_REWRITES: http://localhost:4000=http://host.docker.internal:4000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    # No `healthcheck:` here: the image defines one that only passes once the OCR models have loaded.

volumes:
  pgdata:
  redisdata:
  miniodata:
