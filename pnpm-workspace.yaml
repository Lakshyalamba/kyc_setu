packages:
  - 'apps/*'
  - 'packages/*'
# Packages allowed to run install scripts (pnpm refuses to install if others try to).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  # Decided: its script only prints a Vue 2/3 compatibility notice; the API reference viewer does not need it.
  vue-demi: false
