name: PR checks

# What has to be true before a change lands. The same steps run locally with `make verify`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kyc:kyc@localhost:5432/kyc_setu_test
  TEST_DATABASE_URL: postgresql://kyc:kyc@localhost:5432/kyc_setu_test
  REQUIRE_INFRA: '1'
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000 # read at build time: the web app refuses to build without it
  JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
  AI_INTERNAL_KEY: dev-internal-key-change-me-0123456789
  KMS_LOCAL_MASTER_KEY: ZGV2LW9ubHkta21zLW1hc3Rlci1rZXktMDEyMzQ1Njc=
  FILE_URL_SECRET: dev-only-file-url-secret-change-me-0123456789
  PII_ENCRYPTION_KEY: ZGV2LW9ubHktcGlpLWtleS1jaGFuZ2UtbWUtMDEyMzQ=

jobs:
  secrets:
    name: no secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not only the tip
      - name: gitleaks
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact

  verify:
    name: typecheck · lint · prisma validate · tests · coverage · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc_setu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kyc" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm db:generate
      - name: Prisma validate
        run: pnpm db:validate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm lint
      - name: Apply migrations to the test database
        run: pnpm --filter @kyc-setu/db run migrate:deploy
      - name: Unit and integration tests, with the coverage gates
        # Integration tests run against the real Postgres, Redis and MinIO above (REQUIRE_INFRA makes a missing one a failure).
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  # Drives the real web + api + Postgres/Redis/MinIO stack in a browser. The OCR specs skip here (no AI service); the
  # nightly workflow runs them.
  e2e:
    name: browser tests (without the OCR service)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc_setu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kyc" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://kyc:kyc@localhost:5432/kyc_setu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - run: cp .env.example .env # real env vars above take precedence over this file
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm --filter @kyc-setu/db run migrate:deploy
      - run: pnpm seed --yes
      - run: pnpm --filter @kyc-setu/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-artifacts
            apps/web/playwright-report
          retention-days: 7
