name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc_setu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kyc" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kyc:kyc@localhost:5432/kyc_setu_test
      TEST_DATABASE_URL: postgresql://kyc:kyc@localhost:5432/kyc_setu_test
      REQUIRE_INFRA: '1'
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      PII_ENCRYPTION_KEY: ZGV2LW9ubHktcGlpLWtleS1jaGFuZ2UtbWUtMDEyMzQ=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @kyc-setu/db run migrate:deploy
      - run: pnpm test

  # Drives the real web + api + Postgres/Redis/MinIO stack in a browser.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc_setu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kyc" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://kyc:kyc@localhost:5432/kyc_setu
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      PII_ENCRYPTION_KEY: ZGV2LW9ubHktcGlpLWtleS1jaGFuZ2UtbWUtMDEyMzQ=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start MinIO
        run: docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
      - run: cp .env.example .env # real env vars above take precedence over this file
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm --filter @kyc-setu/db run migrate:deploy
      - run: pnpm seed
      - run: pnpm --filter @kyc-setu/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
